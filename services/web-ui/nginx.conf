server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Go control-plane service
    location /api/ {
        proxy_pass http://api-go:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Auth requests
    location /auth/ {
        proxy_pass http://api-go:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy runtime-generated assets still owned by backend/worker services
    location /static/ {
        proxy_pass http://api-go:8080/static/;
    }

    # Proxy WebSocket requests
    location /ws {
        proxy_pass http://api-go:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
