services:
  redis:
    image: redis:7.4-alpine
    container_name: fishradar2-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  radar-control:
    build:
      context: ../services/radar-control
    container_name: fishradar2-radar-control
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      APP_ENV: ${APP_ENV:-development}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-auth_session}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-fishradar2:worker_jobs}
      REDIS_EVENT_CHANNEL: ${REDIS_EVENT_CHANNEL:-fishradar2:events}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - default
      - mysql8-shared

  radar-probe:
    build:
      context: ../services/radar-probe
    container_name: fishradar2-radar-probe
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      APP_ENV: ${APP_ENV:-development}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-fishradar2:worker_jobs}
      REDIS_EVENT_CHANNEL: ${REDIS_EVENT_CHANNEL:-fishradar2:events}
      WORKER_ID: fishradar2-dev-worker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../services/radar-probe/logs:/app/logs
      - ../services/radar-probe/images:/app/images
      - ../services/radar-probe/state:/app/state
    networks:
      - default
      - mysql8-shared

  radar-portal:
    build:
      context: ../services/radar-portal
    container_name: fishradar2-radar-portal
    depends_on:
      - radar-control
    ports:
      - "8088:80"

networks:
  mysql8-shared:
    external: true

volumes:
  redis_data:
