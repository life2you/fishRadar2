name: Docker Images

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: radar-control
            context: ./services/radar-control
            dockerfile: ./services/radar-control/Dockerfile
            image_suffix: fishradar2-radar-control
          - name: radar-probe
            context: ./services/radar-probe
            dockerfile: ./services/radar-probe/Dockerfile
            image_suffix: fishradar2-radar-probe
          - name: radar-portal
            context: ./services/radar-portal
            dockerfile: ./services/radar-portal/Dockerfile
            image_suffix: fishradar2-radar-portal
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
