name: CI

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:

jobs:
  radar-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/radar-control
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/radar-control/go.mod
      - run: go test ./...

  radar-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/radar-portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/radar-portal/package-lock.json
      - run: npm ci
      - run: npm run build

  radar-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/radar-probe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-runtime.txt
      - run: python -m compileall src spider_v2.py tools legacy/web_api tests/live
