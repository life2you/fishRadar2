name: CI

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:

jobs:
  api-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api-go/go.mod
      - run: go test ./...

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  worker-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker-py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-runtime.txt
      - run: python -m compileall src spider_v2.py tools legacy/web_api tests/live
